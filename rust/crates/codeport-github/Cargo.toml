[package]
name = "codeport-github"
version = "0.1.0"
edition = "2021"

[dependencies]
codeport-core = { path = "../codeport-core" }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
serde_json = "1"
