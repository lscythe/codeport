[package]
name = "rust_lib_codeport"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib"]

[workspace]
members = ["crates/*"]

[dependencies]
flutter_rust_bridge = "=2.13.0"
codeport-core = { path = "crates/codeport-core" }
codeport-github = { path = "crates/codeport-github" }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
