name: codeport_github
description: GitHub provider package for Codeport. Owns its Riverpod providers.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.13.2
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter
  codeport_core:
    path: ../codeport_core
  flutter_riverpod: ^3.4.3
  riverpod_annotation: ^4.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  riverpod_generator: ^4.0.9
  riverpod_lint: ^3.1.9
