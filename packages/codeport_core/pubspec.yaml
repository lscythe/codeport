version: 0.1.0
publish_to: none

environment:
  sdk: ^3.13.2
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_rust_bridge: 2.13.0
  freezed_annotation: ^3.1.0
